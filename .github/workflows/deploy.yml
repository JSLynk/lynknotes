name: Deploy LynkNotes to GitHub Pages

on:
  repository_dispatch:
    types:
      - deploy-lynknotes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: jeffersonrcs-cmd/lynknotes
          ref: main
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build LynkNotes
        run: |
          bun run build
          test -s .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
          grep -q "/lynknotes/" .output/public/index.html
        env:
          VITE_BASE_PATH: /lynknotes/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
